<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; media-src file:">
  <title>Vertipost</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tabs">
    <button id="tab-publish" class="tab">Publier</button>
    <button id="tab-settings" class="tab">Paramètres</button>
  </nav>

  <main id="page-publish">
    <section class="video">
      <div id="drop" class="drop" tabindex="0" role="button">
        <video id="preview" controls muted hidden></video>
        <p id="drop-hint">Dépose une vidéo verticale ici<br><span>ou clique pour la choisir (.mp4, .mov)</span></p>
      </div>
      <p id="file-info" class="muted"></p>
      <button id="change" class="ghost" hidden>Changer de vidéo</button>
    </section>

    <section class="form">
      <div id="assistant-block" class="assistant">
        <div class="row">
          <span class="name">Assistant de référencement</span>
          <span id="assistant-status" class="muted"></span>
          <span class="grow"></span>
          <button id="assistant-configure" class="ghost">Paramètres</button>
        </div>
        <label>De quoi parle ta vidéo ?
          <textarea id="brief" rows="3" placeholder="Le jeu, son genre, ce qui se passe à l'écran, à qui tu t'adresses..."></textarea>
        </label>
        <button id="advise" disabled>Proposer un titre et des légendes</button>
        <p id="assistant-error" class="bad" hidden></p>
        <div id="advice" hidden></div>
      </div>

      <label>Titre <span class="muted">(YouTube)</span>
        <input id="title" type="text" maxlength="100" placeholder="Le titre de ton Short">
      </label>
      <label>Légende <span class="muted">(toutes les plateformes, hashtags compris)</span>
        <textarea id="caption" rows="4" placeholder="Ta légende #shorts"></textarea>
      </label>
      <label>Mots-clés de ta niche <span class="muted">(séparés par des virgules : le nom du jeu, son genre...)</span>
        <input id="keywords" type="text" placeholder="mon jeu, roguelike, jeu indé">
      </label>
      <div id="score" class="score">
        <p><span class="name">Pertinence</span> <span id="score-total" class="muted"></span></p>
        <ul id="score-list"></ul>
        <p class="muted">Repères de bonnes pratiques, calculés sur le titre et la légende commune. Ce n'est pas une prédiction de vues.</p>
      </div>

      <label class="inline">Visibilité sur YouTube
        <select id="privacy">
          <option value="public">Publique</option>
          <option value="unlisted">Non répertoriée</option>
          <option value="private">Privée</option>
        </select>
      </label>

      <label class="inline">Catégorie YouTube
        <select id="category"></select>
      </label>

      <h2>Plateformes</h2>
      <div id="platforms"></div>

      <p id="error" class="bad" hidden></p>
      <button id="publish" class="primary" disabled>Publier</button>
    </section>
  </main>

  <section id="page-settings" class="settings" hidden>
    <h2>Assistant par IA</h2>
    <label class="inline">
      <input id="assistant-enabled" type="checkbox">
      Afficher l'assistant par IA dans l'onglet Publier
    </label>
    <ol id="assistant-help"></ol>
    <form id="assistant-form">
      <div id="assistant-fields"></div>
      <label>Langue du titre et des légendes
        <select id="language">
          <option value="">Celle de ma description</option>
          <option value="fr">Français</option>
          <option value="en">Anglais</option>
        </select>
      </label>
      <p id="assistant-form-error" class="bad" hidden></p>
      <div class="row">
        <span id="assistant-links"></span>
        <span class="grow"></span>
        <span id="assistant-saved" class="good" hidden>Enregistré.</span>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </section>

  <dialog id="settings">
    <form method="dialog">
      <h2 id="settings-title"></h2>
      <ol id="settings-help"></ol>
      <label>Adresse de redirection à déclarer dans l'application
        <input id="settings-redirect" type="text" readonly>
      </label>
      <div id="settings-fields"></div>
      <p id="settings-error" class="bad" hidden></p>
      <div class="row">
        <button id="settings-console" type="button" class="ghost">Ouvrir la console développeur</button>
        <span class="grow"></span>
        <button id="settings-cancel" type="button" class="ghost">Annuler</button>
        <button type="submit" class="primary">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <script src="renderer.js"></script>
</body>
</html>
